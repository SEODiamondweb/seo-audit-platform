services:
  bot:
    build: .
    container_name: slack-seo-audit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DATA_DIR: /app/data
    volumes:
      - audit-data:/app/data
    # Chromium headless ha bisogno di piu' shared memory del default (64MB)
    shm_size: "512mb"
    init: true

volumes:
  audit-data:
